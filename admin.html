<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin | Azure Haven</title><link rel="stylesheet" href="css/style.css"></head><body><nav id="nav"></nav><main class="page"><p class="eyebrow">ADMIN DASHBOARD</p><h1>Hotel management</h1><div class="stats" id="adminStats"></div><div class="admin-columns"><section><h2>Add or edit room</h2><form class="form-card" id="roomForm"><input type="hidden" id="editRoomId"><label>Room name<input id="adminRoomName" required></label><div class="form-row"><label>Type<select id="adminRoomType"><option>Single</option><option>Double</option><option>Deluxe</option><option>Suite</option></select></label><label>Price per night<input id="adminRoomPrice" type="number" required></label></div><label>Maximum guests<input id="adminRoomCapacity" type="number" min="1" required></label><label>Image URL<input id="adminRoomImage" required></label><label>Description<textarea id="adminRoomDescription" required></textarea></label><label>Amenities (comma separated)<input id="adminRoomAmenities" placeholder="Wi-Fi, Breakfast"></label><button class="button">Save room</button></form></section><section><h2>Rooms</h2><div id="adminRooms"></div><h2>All bookings</h2><div id="adminBookings"></div></section></div></main><script src="js/main.js"></script><script src="js/admin.js"></script></body></html>
