<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book Your Stay | Azure Haven</title><link rel="stylesheet" href="css/style.css"></head><body><nav id="nav"></nav><main class="page narrow"><p class="eyebrow">RESERVATION</p><h1>Book your stay</h1><form id="bookingForm" class="form-card"><div class="form-row"><label>Guest name<input id="guestName" required></label><label>Email<input type="email" id="guestEmail" required></label></div><div class="form-row"><label>Phone number<input id="guestPhone" required></label><label>Selected room<select id="bookingRoom" required></select></label></div><div class="form-row"><label>Check-in<input type="date" id="checkIn" required></label><label>Check-out<input type="date" id="checkOut" required></label></div><label>Number of guests<select id="guests" required><option value="1">1 guest</option><option value="2">2 guests</option><option value="3">3 guests</option><option value="4">4 guests</option></select></label><div class="total" id="bookingTotal">Select dates to see total</div><p class="form-message" id="bookingMessage"></p><button class="button" type="submit">Confirm booking</button></form></main><footer id="footer"></footer><script src="js/main.js"></script><script src="js/booking.js"></script></body></html>
